# Drop this into .github/workflows/hibi.yml
#
# Fails the build when a recorded document sentence gates: an anchored span
# changed, was orphaned, or became ambiguous; submitted evidence or a
# referenced document refutes it; or it contradicts another sentence.
# The official hibi composite action installs Bun and runs `hibi check`
# (falling back to `bunx @npupko/hibi` when no binary is on PATH).
#
# The judge reads TYPESAFE_API_KEY from the step environment. Without it,
# judgments not already in the .claims/judge/ cache are pending, which warns
# and does not fail the build.
#
# .claims/judge/ is a local cache and is not committed (`hibi init` writes
# .claims/.gitignore with `judge/`). The actions/cache step below restores it
# between runs, keyed on the claim files.
#
# Pin to a released tag or a commit SHA for supply-chain safety, and bump the
# tag when you upgrade hibi.

name: hibi

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for `since` (it diffs against a ref)
          # path: handbook # with sibling repos, see below

      # If .claims/config.json maps repo aliases (e.g. "api": "../api"),
      # check this repo out under a path (above), each sibling next to it,
      # and set working-directory to this repo's path. A sibling that is not
      # checked out leaves its claims `unavailable` (a warning).
      # - uses: actions/checkout@v4
      #   with:
      #     repository: your-org/api
      #     path: api

      - name: Restore the judge cache
        uses: actions/cache@v4
        with:
          path: .claims/judge # with working-directory, prefix this path and the hashFiles pattern with it
          key: hibi-judge-${{ hashFiles('.claims/claims/**') }}
          restore-keys: hibi-judge-

      - name: Check documentation claims
        uses: npupko/hibi@v0.6.0
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        with:
          fail-on: gating # gating | warn | never
          # since: origin/${{ github.base_ref }}  # `check --since <ref>`: only claims touching changed files; pull_request only (base_ref is empty on push, and an unknown ref exits 1)
          # doc: CLAUDE.md                         # `check --doc <path>`: one document; expired claims gate
          # working-directory: "."                 # directory holding the .claims store (handbook with siblings)
