version: 2
updates:
  # The Cargo workspace: root Cargo.toml, crates/*, Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # tree-sitter and the grammar crates are part of the `ast-v1`
      # fingerprint definition (design/SPEC.md section 8.4). A new version can
      # change fingerprints, so they are updated by hand, with the case files.
      - dependency-name: "tree-sitter"
      - dependency-name: "tree-sitter-*"

  # Workflows; keeps the SHA pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    # release.yml is generated by cargo-dist from dist-workspace.toml; an edit
    # here would make `dist plan` report it as out of date. Its action pins
    # live in [dist.github-action-commits] and are updated there by hand.
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
