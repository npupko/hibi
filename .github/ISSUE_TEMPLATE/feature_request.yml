name: Feature request
description: Suggest a change or addition to hibi.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the change you have in mind. The
        problem helps find a design that fits the rest of the tool.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed change
      description: The command, option or output you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or thought about.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
