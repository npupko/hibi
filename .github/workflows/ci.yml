name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On pull requests a new push cancels the older run; every push to main
  # runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace
      # `-p hibi`, not `--workspace`: hibi-cli enables every feature, and a
      # workspace build would unify them back on.
      - name: Build the library with its features off
        run: cargo build -p hibi --no-default-features
      - name: Test the library with its features off
        run: cargo test -p hibi --no-default-features

  # Minimum supported Rust version, from `rust-version` in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: "1.90"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets

  schemas:
    name: schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p hibi-cli --example write-schemas
      - name: schemas/ matches the generator
        run: |
          git add --all schemas/
          if ! git diff --exit-code HEAD -- schemas/; then
            echo "::error::schemas/ is out of date. Run: cargo run -p hibi-cli --example write-schemas"
            exit 1
          fi

  cli-reference:
    name: CLI-reference drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p hibi-cli --example cli-reference
      - name: plugins/hibi-cli/skills/hibi/references/cli-reference.md matches the generator
        run: |
          git add --all plugins/hibi-cli/skills/hibi/references/cli-reference.md
          if ! git diff --exit-code HEAD -- plugins/hibi-cli/skills/hibi/references/cli-reference.md; then
            echo "::error::The CLI reference is out of date. Run: cargo run -p hibi-cli --example cli-reference"
            exit 1
          fi

  # Prints what hibi reports about this repository's own claims. The job is
  # report-only: each step prints hibi's output and passes whatever hibi's
  # exit status is. A non-zero status, such as `hibi cover` exiting 1 with
  # `no_scopes` while the store has no scopes, is printed and raised as a
  # warning annotation.
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p hibi-cli
      - name: hibi status
        run: |
          if [ ! -d .hibi ]; then
            echo "::notice::This repository has no .hibi/ store yet, so there is nothing to report."
            exit 0
          fi
          code=0
          ./target/debug/hibi status --format human || code=$?
          echo "hibi status exited with status $code"
          if [ "$code" -ne 0 ]; then
            echo "::warning::hibi status exited with status $code; this job is report-only and passes."
          fi
      - name: hibi cover
        run: |
          if [ ! -d .hibi ]; then
            echo "::notice::This repository has no .hibi/ store yet, so there is nothing to report."
            exit 0
          fi
          code=0
          ./target/debug/hibi cover --format human || code=$?
          echo "hibi cover exited with status $code"
          if [ "$code" -ne 0 ]; then
            echo "::warning::hibi cover exited with status $code; this job is report-only and passes."
          fi
