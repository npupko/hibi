name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; no job in this workflow needs write scopes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.2 # keep in lockstep with the @biomejs/biome devDependency
      - run: biome ci . # read-only; emits GitHub annotations

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build:grammars
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
      - name: Schemas are up to date
        run: |
          bun run build:schemas
          git diff --exit-code schemas/ || (echo "schemas/ is stale — run bun run build:schemas" && exit 1)
      - name: CLI reference and completions are generated from the option tables
        run: |
          bun run build:cli-reference
          git diff --exit-code docs/cli-reference.mdx plugins/hibi-cli/skills/hibi/references/cli-reference.md || (echo "generated CLI reference is stale — run bun run build:cli-reference" && exit 1)
      - name: Dogfood — hibi checks its own docs (in-tree engine, read-only)
        # Runs the current tree's engine read-only (no --write) and executes
        # declared verifiers, so drift this PR introduces between docs/ and
        # src/ fails the build via hibi itself.
        run: bun run src/cli/index.ts check --run-verifiers --fail-on gating
